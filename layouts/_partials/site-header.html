<header class="site-header">
  <div class="page-width site-header__inner">
    <a class="site-header__brand" href="{{ site.Home.RelPermalink }}">{{ partial "logo.html" . }}</a>
    {{- with site.Menus.main }}
    <nav aria-label="Main">
      <ul class="site-nav">
        {{- range . }}
        <li><a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
      </ul>
    </nav>
    {{- end }}
  </div>
</header>
